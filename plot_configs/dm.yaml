# Example plot config for plot_results.py
# Usage: python plot_results.py results/*.json --config plot_configs/example.yaml --out out.png
#
# Each entry controls one method label (as generated by _method_label in plot_results.py).
# All fields except 'label' are optional.
# Unlisted methods are appended after in alphabetical order with default colors/linestyles.
#
# linestyle options: solid | dashed | dotted | dashdot | [on_px, off_px, ...] (dash tuple)
# color options: any matplotlib color string, hex code, or named color (e.g. "tab:blue", "#d62728")


title: "DMO"
figsize: [7, 4.5]
save_legend: false

methods:
  - label: RANDOM
    color: "tab:blue"
    linestyle: solid

  - label: TS
    color: "tab:orange"
    linestyle: solid

  - label: EI
    color: "tab:green"
    linestyle: solid

  - label: QNEI
    color: "tab:red"
    linestyle: solid

  - label: QNEI(q=5)
    color: "tab:red"
    linestyle: dashed

  - label: UCB
    color: "tab:purple"
    linestyle: solid

  - label: UCB_beta_2.0
    color: "tab:purple"
    linestyle: dashed

  - label: KG
    color: "tab:brown"
    linestyle: solid

  - label: PES
    color: "tab:pink"
    linestyle: solid

  - label: MES
    color: "tab:gray"
    linestyle: solid

  - label: MES(q=5)
    color: "tab:gray"
    linestyle: dashed

  - label: GIBBON
    color: "tab:olive"
    linestyle: solid

  - label: GIBBON(q=5)
    color: "tab:olive"
    linestyle: dashed

  - label: JES
    color: "tab:cyan"
    linestyle: solid

