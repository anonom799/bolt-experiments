# Example plot config for plot_results.py
# Usage: python plot_results.py results/*.json --config plot_configs/example.yaml --out out.png
#
# Each entry controls one method label (as generated by _method_label in plot_results.py).
# All fields except 'label' are optional.
# Unlisted methods are appended after in alphabetical order with default colors/linestyles.
#
# linestyle options: solid | dashed | dotted | dashdot | [on_px, off_px, ...] (dash tuple)
# color options: any matplotlib color string, hex code, or named color (e.g. "tab:blue", "#d62728")

title: "DMO"
figsize: [5, 4.5]
save_legend: True

methods:
  - label: RANDOM
    color: "#438fc2"
    linestyle: solid

  - label: TS
    color: "#d07171"
    linestyle: solid

  - label: EI
    color: "#738b46"
    linestyle: solid

  - label: KG
    color: "#5e5e5e"
    linestyle: solid

  - label: QNEI
    color: "#0854a0"
    linestyle: solid

  - label: QNEI(q=5)
    color: "#0854a0"
    linestyle: dashed

  - label: UCB
    color: "#2c663d"
    linestyle: solid

  - label: UCB(beta=2.0)
    color: "#2c663d"
    linestyle: dashed

  - label: PES
    color: "#c16700"
    linestyle: solid

  - label: MES
    color: "#0BccB9"
    linestyle: solid

  - label: MES(q=5)
    color: "#0BccB9"
    linestyle: dashed

  - label: GIBBON
    color: "#d7b104"
    linestyle: solid

  - label: GIBBON(q=5)
    color: "#d7b104"
    linestyle: dashed

  - label: JES
    color: "#9F005D"
    linestyle: solid
