# Example plot config for plot_results.py
# Usage: python -m bolt_exp.plot_results results/*.json --config plot_configs/example.yaml --out out.png
#
# Each entry controls one method label (as generated by _method_label in plot_results.py).
# All fields except 'label' are optional.
# Unlisted methods are appended after in alphabetical order with default colors/linestyles.
#
# linestyle options: solid | dashed | dotted | dashdot | [on_px, off_px, ...] (dash tuple)
# color options: any matplotlib color string, hex code, or named color (e.g. "tab:blue", "#d62728")

title: "DMO-MO"
figsize: [5, 4]
save_legend: True

methods:
  - label: RANDOM
    color: "#000000"
    linestyle: dotted

  - label: TSEMO
    color: "#000000"
    linestyle: solid

  - label: NSGA-II(pop_size=50)
    color: "#E69F00"
    linestyle: solid

  - label: ParEGO
    color: "#56B4E9"
    linestyle: solid

  - label: NEHVI
    color: "#009E73"
    linestyle: solid

  - label: PES_MO
    color: "#0072B2"
    linestyle: solid

  - label: MES_MO
    color: "#D55E00"
    linestyle: solid

  - label: JES_MO
    color: "#999999"
    linestyle: solid

