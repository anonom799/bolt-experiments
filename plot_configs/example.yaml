# Example plot config for plot_results.py
# Usage: python plot_results.py results/*.json --config plot_configs/example.yaml --out out.png
#
# Optional top-level fields:
#   title:       plot title (overrides the auto-generated default; --title CLI arg takes precedence)
#   figsize:     [width, height] in inches (default: [7, 4.5])
#   save_legend:    true to also save the legend as {stem}_legend{suffix} (default: false)
#   skip_unlisted: true to exclude methods not listed in 'methods' (default: false)
#
# methods: list of per-method entries. All fields except 'label' are optional.
# Unlisted methods are appended after in alphabetical order with default colors/linestyles.
#
# linestyle options: solid | dashed | dotted | dashdot | [on_px, off_px, ...] (dash tuple)
# color options: any matplotlib color string, hex code, or named color (e.g. "tab:blue", "#d62728")

title: "HPO Results"
figsize: [7, 4.5]
save_legend: false

methods:
  - label: EI
    color: "tab:blue"
    linestyle: solid

  - label: UCB
    color: "tab:orange"
    linestyle: dashed

  - label: EI+MLHGP
    color: "tab:green"
    linestyle: solid

  - label: EI+KN
    color: "tab:red"
    linestyle: dotted

  - label: SAASBO+EI
    color: "tab:purple"
    linestyle: dashdot

  - label: BAxUS+EI
    color: "tab:brown"
    linestyle: [5, 2, 1, 2]

  - label: RANDOM
    color: "gray"
    linestyle: dotted
