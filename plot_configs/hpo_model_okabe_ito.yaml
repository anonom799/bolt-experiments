# Example plot config for plot_results.py
# Usage: python plot_results.py results/*.json --config plot_configs/example.yaml --out out.png
#
# Each entry controls one method label (as generated by _method_label in plot_results.py).
# All fields except 'label' are optional.
# Unlisted methods are appended after in alphabetical order with default colors/linestyles.
#
# linestyle options: solid | dashed | dotted | dashdot | [on_px, off_px, ...] (dash tuple)
# color options: any matplotlib color string, hex code, or named color (e.g. "tab:blue", "#d62728")

title: "HPO-MF-Disc"
figsize: [5, 4]
save_legend: True
# ymin: -11
# ymax: -5

methods:
  - label: RANDOM
    color: "#000000"
    linestyle: dotted

  - label: ASHA
    color: "#E69F00"
    linestyle: solid

  - label: LogEI
    color: "#56B4E9"
    linestyle: solid
  
  - label: LogNEI
    color: "#009E73"
    linestyle: solid

  - label: UCB
    color: "#F0E442"
    linestyle: solid

  - label: UCB(beta=5.0)
    color: "#F0E442"
    linestyle: dashed

  - label: PES
    color: "#0072B2"
    linestyle: solid

  - label: MF-MES
    color: "#D55E00"
    linestyle: solid

  - label: MF-MES(q=5)
    color: "#D55E00"
    linestyle: dashed

  - label: MF-GIBBON
    color: "#CC79A7"
    linestyle: solid

  - label: MF-GIBBON(q=5)
    color: "#CC79A7"
    linestyle: dashed

