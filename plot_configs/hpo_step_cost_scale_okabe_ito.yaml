  - label: "MF-MES(cost_scale=0.005)"
    color: "#D55E00"
    linestyle: solid

  - label: "MF-MES(cost_scale=0.01)"
    color: "#D55E00"
    linestyle: dashed

  - label: "MF-MES(cost_scale=0.05)"
    color: "#D55E00"
