# Cost-scale comparison config for hpo_fd_step results.
# Color encodes method (Okabe-Ito, matching dm_okabe_ito.yaml); linestyle encodes cost_scale.
#   solid=0.005, dashed=0.01, dotted=0.05
# Usage:
#   python -m bolt_exp.plot_results $(ls results/hpo/hpo_fd_step_*_50iterations*cost*.json) \
#     --config plot_configs/hpo_step_cost_scale_okabe_ito.yaml \
#     --out hpo_step_cost_simple.png --metric log_simple_regret_all \
#     --budget --cost-scale-label

title: "HPO-MF-Cont (cost scale)"
figsize: [5, 4.5]
save_legend: True
skip_unlisted: True
# ymax: -3
# ymin: -8.5

methods:
  - label: "LogEI(cost_scale=0.005)"
    color: "#56B4E9"
    linestyle: solid

  - label: "LogEI(cost_scale=0.01)"
    color: "#56B4E9"
    linestyle: dashed

  - label: "LogEI(cost_scale=0.05)"
    color: "#56B4E9"
    linestyle: dotted

  - label: "LogNEI(cost_scale=0.005)"
    color: "#009E73"
    linestyle: solid

  - label: "LogNEI(cost_scale=0.01)"
    color: "#009E73"
    linestyle: dashed

  - label: "LogNEI(cost_scale=0.05)"
    color: "#009E73"
    linestyle: dotted

  - label: "UCB(cost_scale=0.005)"
    color: "#F0E442"
    linestyle: solid

  - label: "UCB(cost_scale=0.01)"
    color: "#F0E442"
    linestyle: dashed

  - label: "UCB(cost_scale=0.05)"
