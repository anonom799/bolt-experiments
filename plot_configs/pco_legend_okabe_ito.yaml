# Plot config for plot_results.py -- PCO legend strip.
# Usage: python -m bolt_exp.plot_results results/pco32/*.json --config plot_configs/pco_legend_okabe_ito.yaml --out pco_long.pdf
#
# Labels are what _method_label() in plot_results.py produces from `acq_fn`:
# ei -> LogEIC and qnei -> LogNEIC (both are built with `constraints=`, so they
# are not the unconstrained LogEI/LogNEI); the constrained PCO names keep a
# lowercase "c" (cKG, cTS) and the rest are upper-cased as-is.
#
# Colour follows the method family, linestyle the variant within it, so the two
# Optuna baselines (TPE, CMA-ES) share a hue.
#
# Identical to pco32/pco64_okabe_ito.yaml except for the width: the legend picks
# its column count from the figure width, so the wider figure lays the eleven
# methods out in one row. The plot itself is discarded; only the legend is kept.
#
# linestyle options: solid | dashed | dotted | dashdot | [on_px, off_px, ...]

title: "PCO"
figsize: [17, 3.6]
save_legend: True
skip_unlisted: True


methods:

  - label: RANDOM
    color: "#000000"
    linestyle: dotted

  - label: cTS
    color: "#000000"
    linestyle: solid
  
  - label: dSCBO
    color: "#000000"
    linestyle: dashed

  # Non-BO baselines (Optuna), sharing a hue as the pair of model-free samplers.
  - label: TPE
    color: "#E69F00"
    linestyle: solid

  - label: CMAES
    color: "#E69F00"
    linestyle: dashed

  - label: LogEIC
    color: "#56B4E9"
    linestyle: solid

  - label: LogNEIC
    color: "#009E73"
    linestyle: solid

  # Physics-informed GP means (--prior_mean): same acquisition, different model,
  # so each keeps its family colour, sits next to the run it is compared with,
  # and is distinguished by a dashed line.
  - label: LogNEIC+prior
    color: "#009E73"
    linestyle: dashed

  - label: UCB-C
    color: "#F0E442"
    linestyle: solid

  - label: UCB-C+prior
    color: "#F0E442"
    linestyle: dashed

  - label: cKG
    color: "#0072B2"
    linestyle: solid

  - label: cKG+prior
    color: "#0072B2"
    linestyle: dashed

  - label: ADMMBO
    color: "#D55E00"
    linestyle: solid

  - label: ADMMBO+prior
    color: "#D55E00"
    linestyle: dashed

  - label: CMES-IBO
    color: "#CC79A7"
    linestyle: solid
