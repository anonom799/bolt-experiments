# Example plot config for plot_results.py
# Usage: python -m bolt_exp.plot_results results/*.json --config plot_configs/example.yaml --out out.png
#
# Each entry controls one method label (as generated by _method_label in plot_results.py).
# All fields except 'label' are optional.
# Unlisted methods are appended after in alphabetical order with default colors/linestyles.
#
# linestyle options: solid | dashed | dotted | dashdot | [on_px, off_px, ...] (dash tuple)
# color options: any matplotlib color string, hex code, or named color (e.g. "tab:blue", "#d62728")

title: "PO256"
figsize: [3.75, 4.5]
save_legend: True
# ymin: -18
ymax: -3
skip_unlisted: True


methods:
  - label: RANDOM
    color: "#000000"
    linestyle: dotted

  - label: TS
    color: "#000000"
    linestyle: solid

  - label: LogEI
    color: "#E69F00"
    linestyle: solid

  - label: LogNEI
    color: "#009E73"
    linestyle: solid

  - label: LogNEI(q=5)
    color: "#009E73"
    linestyle: dashed

  - label: UCB
    color: "#009E73"
    linestyle: solid

  # - label: MES
  #   color: "#F0E442"
  #   linestyle: solid

  - label: GIBBON
    color: "#F0E442"
    linestyle: solid

  # - label: TuRBO+LogEI
  #   color: "#0072B2"
  #   linestyle: solid

  - label: TuRBO+LogNEI
    color: "#0072B2"
    linestyle: solid 

  - label: TuRBO+LogNEI(q=5)
    color: "#0072B2"
    linestyle: dashed 

  - label: TuRBO+MLESI+LogNEI
    color: "#D55E00"
    linestyle: solid

  - label: TuRBO+MLESI+LogNEI(q=5)
    color: "#D55E00"
    linestyle: dashed

  # - label: BAxUS+LogEI
  #   color: "#CC79A7"
  #   linestyle: solid

  - label: BAxUS+LogNEI
    color: "#CC79A7"
